[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-meme-manager"
version = "0.1.0"
description = "A Discord-native personal meme library with Discord-hosted attachments."
requires-python = ">=3.12"
dependencies = ["discord.py>=2.5,<3", "python-dotenv>=1,<2", "rapidfuzz>=3.14,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "mypy>=1.15"]

[project.scripts]
meme-bot = "meme_manager.app:main"
meme-import = "meme_manager.import_folder:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["meme_manager"]
